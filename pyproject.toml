[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "candi"
version = "1.0.0"
description = "Contig classifier for the Compendium Of Anaerobic Digestion Microbiomes Database (CAnDi)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    { name = "Fotis Baltoumas" }
]
dependencies = [
    "numpy>=2.4.1",
    "polars[rtcompat]>=1.37.1",
    "pyfastx>=2.3.0",
    "biopython>=1.86",
]

[project.scripts]
candi = "candi.cli:main"
gandi = "candi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
